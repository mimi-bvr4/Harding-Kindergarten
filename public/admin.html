<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#012169">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <title>Staff Admin · Harding Parent Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <!-- ============ SIGN IN SCREEN ============ -->
    <div id="loginScreen" class="login-wrap hidden">
        <div class="login-card">
            <img src="/img/hawk-head.png" alt="Harding Hawks" class="login-logo">
            <h1>Staff Sign In</h1>
            <p class="login-sub">Harding Academy Parent Dashboard</p>
            <label class="field-label" for="passwordInput">Password</label>
            <input type="password" id="passwordInput" class="big-input" placeholder="Type the staff password"
                   autocomplete="current-password" autocapitalize="off">
            <button id="loginBtn" class="btn btn-primary btn-block">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>
            <div id="loginError" class="error-msg hidden"></div>
            <p class="login-help">Don't know the password? Ask the front office.</p>
        </div>
    </div>

    <!-- ============ ADMIN APP ============ -->
    <div id="adminApp" class="hidden">
        <header class="admin-topbar">
            <button id="homeBtn" class="topbar-home" title="Back to the main menu">
                <img src="/img/hawk-head-white.png" alt="">
                <span>Dashboard Admin</span>
            </button>
            <div class="topbar-actions">
                <a href="/" target="_blank" class="topbar-link"><i class="fas fa-eye"></i> <span>See parent view</span></a>
                <button id="logoutBtn" class="topbar-link"><i class="fas fa-right-from-bracket"></i> <span>Sign out</span></button>
            </div>
        </header>

        <main id="adminRoot" class="admin-main"></main>
    </div>

    <!-- Big friendly toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="/js/admin.js"></script>
</body>
</html>
