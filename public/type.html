<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#06132E">
<title>Call Numbers · Carline Hold</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#06132E;--panel:#0C1F45;--line:rgba(255,255,255,.12);--gold:#FFC72C;--dim:#7E93BC;--red:#FF3B30}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--navy);color:#fff;
 display:flex;flex-direction:column;overflow:hidden;font-variant-numeric:tabular-nums}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
 border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
.badge{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#06132E;
 background:var(--gold);padding:5px 10px;border-radius:99px}
.hcount{margin-left:auto;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
/* One nav, identical on every staff page, so nobody is ever stranded. */
.nav{display:flex;gap:5px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;color:var(--dim);font-size:12px;font-weight:800;text-decoration:none;
 border:1px solid var(--line);padding:6px 10px;border-radius:99px;white-space:nowrap}
.nav a.on{background:var(--gold);color:#06132E;border-color:transparent}

/* the number being typed — huge, because it is checked at a glance in bad light */
.entry{flex:0 0 auto;text-align:center;padding:14px 10px 6px}
.entry .num{font-size:22vw;font-weight:900;line-height:1;letter-spacing:.02em;min-height:1em}
.entry .num.empty{color:#28406F}
.entry .hint{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;min-height:1.2em}
.entry .hint.dupe{color:var(--gold)}

.pad{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px;min-height:0}
.key{border:0;border-radius:16px;background:var(--panel);color:#fff;font:inherit;font-size:min(9vw,42px);
 font-weight:900;cursor:pointer;border:1px solid var(--line)}
.key:active{background:#16305F}
.key.wide{grid-column:span 1}
.key.act{background:#123063;font-size:min(4.4vw,19px);letter-spacing:.06em;text-transform:uppercase}
.key.go{background:var(--gold);color:#06132E;font-size:min(5.6vw,24px)}
.key.go:active{filter:brightness(.92)}

.strip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);
 padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
.recent{flex:1 1 auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.recent::-webkit-scrollbar{display:none}
/* Undo removes the newest call and only ever the newest call. It is enabled
   only when this phone is the one that sent it — two typists share this
   queue, and pulling back someone else's car is worse than a typo. */
.undo{flex:0 0 auto;border:1px solid rgba(255,59,48,.55);background:rgba(255,59,48,.12);color:#FF8A80;
 border-radius:10px;padding:7px 11px;font:inherit;font-size:12.5px;font-weight:900;cursor:pointer;white-space:nowrap}
.undo b{color:#fff;font-size:16px;font-weight:900}
.undo:disabled{opacity:.4;border-color:var(--line);background:transparent;color:var(--dim);cursor:default}
.undo:disabled b{color:var(--dim);font-size:14px}
.undo.hidden{display:none}
.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
 padding:7px 11px;font-size:17px;font-weight:900}
.chip.first{background:var(--gold);color:#06132E}
.off{position:fixed;inset:0;background:rgba(2,11,29,.92);display:flex;align-items:center;justify-content:center;
 font-size:16px;font-weight:800;color:var(--red);z-index:9}
.off.hidden{display:none}
</style></head><body>

<header>
  <nav class="nav">
    <a class="on" href="/type">Keypad</a>
    <a href="/staff">Staff</a>
    <a href="/display">Gym</a>
    <a href="/roster">Roster</a>
  </nav>
  <span class="hcount" id="count">0 called</span>
</header>

<div class="entry">
  <div class="num empty" id="num">—</div>
  <div class="hint" id="hint">Type a car number</div>
</div>

<div class="pad" id="pad">
  <button class="key" data-d="1">1</button><button class="key" data-d="2">2</button><button class="key" data-d="3">3</button>
  <button class="key" data-d="4">4</button><button class="key" data-d="5">5</button><button class="key" data-d="6">6</button>
  <button class="key" data-d="7">7</button><button class="key" data-d="8">8</button><button class="key" data-d="9">9</button>
  <button class="key act" id="del">Delete</button><button class="key" data-d="0">0</button>
  <button class="key go" id="go">Call</button>
</div>

<div class="strip">
  <button class="undo hidden" id="undo">↶ Undo <b id="undoNum"></b></button>
  <div class="recent" id="recent"></div>
</div>
<div class="off hidden" id="off">Offline — the last calls may not have sent</div>

<script>
(function(){
 var buf='', calls=[], sending=false;
 // Calls this phone produced, keyed by the server's timestamp. Undo is
 // offered only for these — never for a car another typist just sent.
 var myAts={}, pendingMine=null;
 var elNum=document.getElementById('num'), elHint=document.getElementById('hint'),
     elRecent=document.getElementById('recent'), elCount=document.getElementById('count'),
     elOff=document.getElementById('off'),
     elUndo=document.getElementById('undo'), elUndoNum=document.getElementById('undoNum');

 function paint(){
   elNum.textContent = buf || '—';
   elNum.classList.toggle('empty', !buf);
   elCount.textContent = calls.length + ' called';
   elRecent.innerHTML = calls.slice(0,24).map(function(c,i){
     return '<span class="chip'+(i===0?' first':'')+'">'+c.number+'</span>'; }).join('');
   paintUndo();
 }

 function paintUndo(){
   var top = calls[0];
   elUndo.classList.toggle('hidden', !top);
   if(!top) return;
   var can = !!myAts[top.at];
   elUndo.disabled = !can;
   elUndo.firstChild.nodeValue = can ? '↶ Undo ' : '↶ Last ';
   elUndoNum.textContent = top.number;
   elUndo.title = can ? 'Remove '+top.number : 'The last call came from another phone';
 }
 function hint(t,cls){ elHint.textContent=t; elHint.className='hint'+(cls?' '+cls:''); }

 function press(d){ if(buf.length<5){ buf+=d; paint(); hint('Press Call'); } }
 function del(){ buf=buf.slice(0,-1); paint(); hint(buf?'Press Call':'Type a car number'); }

 function send(){
   if(!buf || sending) return;
   var n=buf; sending=true;
   fetch('/api/hold/call',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({number:n})})
    .then(function(r){return r.json();})
    .then(function(j){
       sending=false; elOff.classList.add('hidden');
       if(j.duplicate){ hint('Already called just now','dupe'); }
       else { hint('Called '+n); pendingMine=n; }
       buf=''; paint(); load();
    })
    .catch(function(){ sending=false; elOff.classList.remove('hidden'); });
 }

 function undo(){
   var top=calls[0];
   if(!top || !myAts[top.at] || sending) return;
   sending=true;
   fetch('/api/hold/undo',{method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({number:top.number})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(x){
       sending=false; elOff.classList.add('hidden');
       if(x.ok){ delete myAts[top.at]; hint('Removed '+x.j.removed,'dupe'); }
       else { hint(x.j.error || 'Could not undo','dupe'); }
       load();
    })
    .catch(function(){ sending=false; elOff.classList.remove('hidden'); });
 }

 function load(){
   fetch('/api/hold',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
     calls=j.calls||[];
     // Claim the call we just sent, so Undo knows it is ours.
     if(pendingMine && calls.length && String(calls[0].number)===pendingMine){
       myAts[calls[0].at]=true; pendingMine=null;
     }
     paint(); elOff.classList.add('hidden');
   }).catch(function(){ elOff.classList.remove('hidden'); });
 }

 document.getElementById('pad').addEventListener('click',function(e){
   var k=e.target.closest('.key'); if(!k) return;
   if(k.dataset.d) return press(k.dataset.d);
   if(k.id==='del') return del();
   if(k.id==='go')  return send();
 });
 elUndo.addEventListener('click',undo);
 // A keyboard is faster than a touchscreen when there is one.
 document.addEventListener('keydown',function(e){
   if(e.key>='0'&&e.key<='9') return press(e.key);
   if(e.key==='Backspace'){e.preventDefault();return del();}
   if(e.key==='Enter') return send();
   if(e.key==='u'||e.key==='U'){e.preventDefault();return undo();}
 });

 load(); setInterval(load,4000); paint();
})();
</script></body></html>
