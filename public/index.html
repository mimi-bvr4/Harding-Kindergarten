<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#012169">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kivett Dashboard">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>Harding Academy · Kivett Family</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css?v=4">
</head>
<body>
    <!-- Top app bar -->
    <header id="topbar" class="brand-header text-white sticky top-0 z-30">
        <div class="flex items-center justify-between px-3 py-2.5">
            <button id="menuBtn" aria-label="Open menu"
                    class="topbar-btn">
                <i class="fas fa-bars text-lg"></i>
            </button>
            <div class="flex items-center gap-2 flex-1 justify-center min-w-0 px-2">
                <img src="/img/hawk-head-white.png" alt="" class="topbar-logo">
                <div class="text-center min-w-0">
                    <div id="pageTitle" class="text-[15px] font-bold leading-tight truncate">Harding Academy</div>
                    <div id="pageSubtitle" class="text-[11px] text-blue-200 leading-tight truncate tracking-wide uppercase">Kivett Family</div>
                </div>
            </div>
            <button id="refreshBtn" aria-label="Refresh" class="topbar-btn">
                <i class="fas fa-rotate-right text-base"></i>
            </button>
        </div>
    </header>

    <!-- Slide-out menu + scrim -->
    <div id="navScrim" class="fixed inset-0 bg-slate-900/60 backdrop-blur-[2px] z-40 hidden opacity-0 transition-opacity duration-200"></div>
    <nav id="navDrawer" class="fixed top-0 left-0 h-full w-[300px] max-w-[85vw] bg-white z-50 shadow-2xl
                                transform -translate-x-full transition-transform duration-200 overflow-y-auto flex flex-col">
        <div class="brand-header text-white px-5 pt-5 pb-4 relative overflow-hidden">
            <img src="/img/hawk-head-white.png" alt="" class="drawer-hawk-bg">
            <div class="relative flex items-start justify-between">
                <div>
                    <div class="text-[10px] uppercase tracking-[0.18em] text-blue-200 font-semibold">Harding Academy</div>
                    <div class="text-xl font-extrabold mt-0.5">Kivett Family</div>
                    <div class="text-xs text-blue-200 mt-1">Parent Dashboard</div>
                </div>
                <button id="navCloseBtn" aria-label="Close menu" class="topbar-btn">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
        </div>
        <div id="navItems" class="py-2 flex-1"></div>
        <div class="px-5 py-3 border-t border-slate-100 text-[11px] text-slate-500 flex items-center justify-between gap-2">
            <div>
                <div class="font-semibold text-slate-700">Last updated</div>
                <div id="navLastUpdated" class="text-slate-500">—</div>
            </div>
            <a href="/admin" class="text-slate-400 hover:text-slate-600 font-semibold whitespace-nowrap">
                <i class="fas fa-lock text-[10px] mr-1"></i>Staff
            </a>
        </div>
    </nav>

    <!-- Main render target -->
    <main id="root" class="pb-16">
        <div class="min-h-[70vh] flex items-center justify-center px-6">
            <div class="text-center">
                <img src="/img/hawk-body.png" alt="" class="w-32 h-auto mx-auto opacity-80 mb-4 animate-soar">
                <div class="text-sm font-semibold text-slate-600">Loading dashboard…</div>
                <div class="text-xs text-slate-400 mt-1">Go Hawks</div>
            </div>
        </div>
    </main>

    <script src="/js/utils.js?v=4"></script>
    <script src="/js/show-and-share.js?v=4"></script>
    <script src="/js/ical-parser.js?v=4"></script>
    <script src="/js/app.js?v=4"></script>
</body>
</html>
