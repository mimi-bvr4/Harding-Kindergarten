<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harding Academy - Kivett Family Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="bg-gray-50">
    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-gray-500">Loading dashboard...</p>
            </div>
        </div>
    </div>

    <!-- Utilities (no dependencies) -->
    <script src="/js/utils.js"></script>
    <!-- Data files (depend on utils for toDateStr) -->
    <script src="/js/show-and-share.js"></script>
    <script src="/js/ical-parser.js"></script>
    <!-- Main app (depends on everything above) -->
    <script src="/js/app.js"></script>
</body>
</html>
