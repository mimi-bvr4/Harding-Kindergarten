<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#012169">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Harding PreK">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <title>Harding PreK · Parent Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css?v=5">
</head>
<body>
    <!-- Top app bar -->
    <header id="topbar" class="brand-header" style="position:sticky;top:0;z-index:30;color:#fff">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px">
            <button id="menuBtn" aria-label="Open menu" class="topbar-btn">
                <i class="fas fa-bars" style="font-size:17px"></i>
            </button>
            <div style="display:flex;align-items:center;gap:9px;flex:1;justify-content:center;min-width:0;padding:0 8px">
                <img src="/img/hawk-head-white.png" alt="" class="topbar-logo">
                <div style="text-align:center;min-width:0">
                    <div id="pageTitle" class="display" style="font-size:16px;font-weight:600;line-height:1.15;
                         white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Harding PreK</div>
                    <div id="pageSubtitle" style="font-size:10.5px;color:#BFDBFE;line-height:1.3;
                         letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
                         text-overflow:ellipsis">Harding Academy</div>
                </div>
            </div>
            <button id="refreshBtn" aria-label="Refresh" class="topbar-btn">
                <i class="fas fa-rotate-right" style="font-size:15px"></i>
            </button>
        </div>
    </header>

    <!-- Slide-out menu + scrim -->
    <div id="navScrim" class="hidden"
         style="position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(2px);
                z-index:40;opacity:0;transition:opacity .2s"></div>
    <nav id="navDrawer"
         style="position:fixed;top:0;left:0;height:100%;width:300px;max-width:85vw;background:#fff;z-index:50;
                box-shadow:0 25px 50px -12px rgba(0,0,0,.35);transform:translateX(-100%);
                transition:transform .2s;overflow-y:auto;display:flex;flex-direction:column">
        <div class="brand-header" style="color:#fff;padding:20px 20px 16px;position:relative;overflow:hidden">
            <img src="/img/hawk-head-white.png" alt="" class="drawer-hawk-bg">
            <div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between">
                <div>
                    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.18em;
                                color:#BFDBFE;font-weight:700">Harding Academy</div>
                    <div class="display" style="font-size:21px;font-weight:600;margin-top:3px">Harding PreK</div>
                    <div style="font-size:12px;color:#BFDBFE;margin-top:3px">Parent Dashboard</div>
                </div>
                <button id="navCloseBtn" aria-label="Close menu" class="topbar-btn">
                    <i class="fas fa-times" style="font-size:17px"></i>
                </button>
            </div>
        </div>
        <div id="navItems" style="padding:8px 0;flex:1"></div>
        <div style="padding:13px 20px;border-top:1px solid #F1F5F9;display:flex;align-items:center;
                    justify-content:space-between;gap:8px;font-size:11px;color:#64748B">
            <div>
                <div style="font-weight:700;color:#334155">Last updated</div>
                <div id="navLastUpdated" style="color:#94A3B8">—</div>
            </div>
            <a href="/admin" style="color:#94A3B8;font-weight:700;white-space:nowrap;text-decoration:none">
                <i class="fas fa-lock" style="font-size:10px;margin-right:4px"></i>Staff
            </a>
        </div>
    </nav>

    <!-- Main render target -->
    <main id="root" style="padding-bottom:56px">
        <div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="text-align:center">
                <img src="/img/hawk-body.png" alt="" class="animate-soar"
                     style="width:128px;margin:0 auto 16px;opacity:.8;display:block">
                <div style="font-size:14px;font-weight:600;color:#475569">Loading…</div>
                <div style="font-size:12px;color:#94A3B8;margin-top:4px">Go Hawks</div>
            </div>
        </div>
    </main>

    <script src="/js/app.js?v=6"></script>
</body>
</html>
